name: Simulation environment
description: Install the pinned library environment and recorded conveyor dataset
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: library/.python-version
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.10.4"
    - name: Install pinned dependencies
      shell: bash
      working-directory: library
      run: |
        uv sync --frozen --extra tests --extra policies --extra sim-e2e --extra cu128
        uv run --no-sync python -c 'from tests.integration.simulation_e2e import attest_runtime; print(attest_runtime())'
    - name: Fetch pinned recording
      shell: bash
      working-directory: library
      run: |
        uv run --no-sync hf download Albertvh97/conveyor-sort-sim-demos --repo-type dataset \
          --revision 6a949360761fee17089fbaaf8bc53f59715cb575 --local-dir "$SIM_E2E_DATASET_DIR" \
          --include 'simulation.json' --include 'meta/*' --include 'data/*' --include 'videos/*'
        test -f "$SIM_E2E_DATASET_DIR/meta/info.json"
